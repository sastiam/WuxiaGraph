services:
  wuxiagraph:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_OPTIONS=--max-old-space-size=384
      - NODE_ENV=production
      - PORT=3000
    deploy:
      resources:
        limits:
          memory: 480M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - wuxiagraph_data:/app/data
    restart: unless-stopped

volumes:
  wuxiagraph_data:
